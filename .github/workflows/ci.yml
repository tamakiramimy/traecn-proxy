name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/TrancnProxy.Tests/TrancnProxy.Tests.csproj

      - name: Build
        run: >-
          dotnet build tests/TrancnProxy.Tests/TrancnProxy.Tests.csproj
          --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/TrancnProxy.Tests/TrancnProxy.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
