name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the build (no leading v)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: >-
          dotnet test tests/TrancnProxy.Tests/TrancnProxy.Tests.csproj
          --configuration Release

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid:
          - osx-x64
          - osx-arm64
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained executable
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            label="${GITHUB_REF_NAME}"
          else
            label="v${{ inputs.version }}"
          fi
          version="${label#v}"

          output="publish/${{ matrix.rid }}"
          archive="trancn-proxy-${label}-${{ matrix.rid }}.zip"

          dotnet publish TrancnProxy.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output "$output" \
            -p:Version="$version" \
            -p:ContinuousIntegrationBuild=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:PublishTrimmed=false

          mkdir -p dist
          (
            cd "$output"
            zip -q -r "../../dist/$archive" .
          )

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip