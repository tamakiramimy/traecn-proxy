name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the build (no leading v)"
        required: false
        default: "0.0.0-dev"
      publish_docker:
        description: "Build and push the Docker image"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: >-
          dotnet test tests/TrancnProxy.Tests/TrancnProxy.Tests.csproj
          --configuration Release

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid:
          - osx-x64
          - osx-arm64
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained executable
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            label="${GITHUB_REF_NAME}"
          else
            label="v${{ inputs.version }}"
          fi
          version="${label#v}"

          output="publish/${{ matrix.rid }}"
          archive="trancn-proxy-${label}-${{ matrix.rid }}.zip"

          dotnet publish TrancnProxy.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output "$output" \
            -p:Version="$version" \
            -p:ContinuousIntegrationBuild=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:PublishTrimmed=false

          mkdir -p dist
          (
            cd "$output"
            zip -q -r "../../dist/$archive" .
          )

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip

  docker:
    name: Build & push Docker image
    needs: publish
    if: ${{ github.ref_type == 'tag' || inputs.publish_docker }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Check Docker Hub credentials
        id: guard
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ -n "$DOCKERHUB_TOKEN" && -n "$DOCKERHUB_USERNAME" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，仅发布到 GHCR"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v5
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true

      - name: Prepare build context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            label="${GITHUB_REF_NAME}"
          else
            label="v${{ inputs.version }}"
          fi
          echo "IMAGE_VERSION=${label#v}" >> "$GITHUB_ENV"

          declare -A rids=( [amd64]=linux-x64 [arm64]=linux-arm64 )
          for arch in "${!rids[@]}"; do
            target=".artifacts/publish/${arch}"
            mkdir -p "$target"
            unzip -q "dist/trancn-proxy-${label}-${rids[$arch]}.zip" -d "$target"
            # 兼容未包含 wwwroot 的历史产物
            [[ -d "$target/wwwroot" ]] || cp -r wwwroot "$target/wwwroot"
            test -f "$target/trancn-proxy"
          done

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.guard.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.guard.outputs.enabled == 'true' && (vars.DOCKERHUB_IMAGE || format('{0}/traecn-proxy', github.repository_owner)) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ env.IMAGE_VERSION }},enable=${{ github.ref_type != 'tag' }}
          flavor: |
            latest=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ env.IMAGE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sync Docker Hub description
        if: steps.guard.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE || format('{0}/traecn-proxy', github.repository_owner) }}
          readme-filepath: docs/dockerhub-overview.md
          short-description: "Trae CN 企业版 -> OpenAI / Anthropic 兼容代理（非官方实验项目）"
